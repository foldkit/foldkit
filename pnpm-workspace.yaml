  '@types/node': 26.4.0
  effect: 4.1.0
  '@effect/platform-browser': 4.1.0
  '@effect/platform-node': 4.1.0
  '@effect/platform-node-shared': 4.1.0
  '@effect/vitest': 4.1.0
  fflate: 0.7.5
  launch-editor: 2.14.2
  '@modelcontextprotocol/sdk>hono': 4.13.11
  'monaco-editor>dompurify': 3.4.16
  shell-quote: 1.11.0
  source-map-js: 1.2.2
  tinypool: 2.1.2
