packages:
  - 'packages/*'
  - 'packages/typing-game/*'
  - 'examples/*'
  - 'comparisons/*'
  - 'internal/*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  msgpackr-extract: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@effect/platform-browser@4.0.0-rc.111'
  - '@effect/platform-node-shared@4.0.0-rc.111'
  - '@effect/platform-node@4.0.0-rc.111'
  - '@effect/vitest@4.0.0-rc.111'
  - effect@4.0.0-rc.111

overrides:
  effect: 4.0.0-rc.111
  '@effect/platform-browser': 4.0.0-rc.111
  '@effect/platform-node': 4.0.0-rc.111
  '@effect/platform-node-shared': 4.0.0-rc.111
  '@effect/vitest': 4.0.0-rc.111
  # @effect/platform-node@4.0.0-rc.111 pins undici 8.7.0, which carries a
  # high-severity advisory; hold it at the patched 8.9.0 line until the pin
  # moves upstream. Scoped to the SSR runtime so jsdom keeps its tested 7.x.
  '@effect/platform-node>undici': '^8.9.0'
